name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Build and Tests
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build release products
        run: swift build -c release
      - name: Build tests
        timeout-minutes: 20
        run: swift build --build-tests
      - name: Test spike core
        timeout-minutes: 10
        run: swift test --disable-xctest --filter SpikeTests
      - name: Test Lyrics slice
        timeout-minutes: 40
        run: swift test --disable-xctest --filter LyricsSliceTests
      - name: Test Lyrics input InputTests
        if: success() || failure()
        timeout-minutes: 10
        run: swift test --disable-xctest --filter LyricsInputTests.InputTests
      - name: Test Lyrics input EnhancedTests
        if: success() || failure()
        timeout-minutes: 10
        run: swift test --disable-xctest --filter LyricsInputTests.EnhancedTests
      - name: Test Lyrics input TTMLTests
        if: success() || failure()
        timeout-minutes: 10
        run: swift test --disable-xctest --filter LyricsInputTests.TTMLTests
      - name: Test Lyrics input ProjectTests
        if: success() || failure()
        timeout-minutes: 10
        run: swift test --disable-xctest --filter LyricsInputTests.ProjectTests
      - name: Test Lyrics input ProgressionTests
        if: success() || failure()
        timeout-minutes: 10
        run: swift test --disable-xctest --filter LyricsInputTests.ProgressionTests
      - name: Test Lyrics input AudioSceneTests
        if: success() || failure()
        timeout-minutes: 10
        # AVFoundation decoding intermittently stalled when these tests ran in parallel on the runner.
        run: swift test --disable-xctest --no-parallel --filter LyricsInputTests.AudioSceneTests

  python:
    name: Python Public Validation Tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0
      - name: Run tests
        run: python -m unittest discover -s Tests/reference_validation
