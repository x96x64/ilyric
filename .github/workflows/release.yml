name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build assets for
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build and Attach Packages
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - name: Report toolchain
        run: |
          sw_vers
          swift --version
      - name: Build release binary
        run: swift build -c release --product ilyrics
      - name: Check version
        run: test "$(.build/release/ilyrics --version)" = "ilyrics ${TAG#v}"
      - name: Package
        # Packaging scripts come from main, so that tags created before packaging existed can be built.
        run: |
          git fetch origin main --depth 1
          mkdir -p packaging/npm
          for f in packaging/package.sh packaging/build_wheel.py packaging/npm/package.json packaging/README.md; do git show origin/main:$f > $f; done
          sh packaging/package.sh "${TAG#v}" .build/release/ilyrics dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Keep the packages for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/

  # Publishing runs only for pushed tags and waits for approval in the protected environments.
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Keep only the wheel
        run: find dist -type f ! -name '*.whl' -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/ilyrics-*.tgz --provenance --access public
