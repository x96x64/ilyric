name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      attach:
        description: Build the packages and attach them to the release
        type: boolean
        default: false
      publish:
        description: Publish the release's attached packages
        type: choice
        options: [none, npm, pypi, both]
        default: none

permissions:
  contents: write

jobs:
  package:
    name: Build and Attach Packages
    if: github.event_name == 'push' || inputs.attach
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - name: Report toolchain
        run: |
          sw_vers
          swift --version
      - name: Build release binary
        run: swift build -c release --product ilyrics
      - name: Check version
        run: test "$(.build/release/ilyrics --version)" = "ilyrics ${TAG#v}"
      - name: Package
        # Packaging scripts come from main, so that tags created before packaging existed can be built.
        run: |
          git fetch origin main --depth 1
          mkdir -p packaging/npm
          for f in packaging/package.sh packaging/build_wheel.py packaging/npm/package.json packaging/README.md; do git show origin/main:$f > $f; done
          sh packaging/package.sh "${TAG#v}" .build/release/ilyrics dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

  # Publishing waits for approval in the protected environments and uses the packages attached to the release, so
  # every channel receives the same files.
  publish-pypi:
    name: Publish to PyPI
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || inputs.publish == 'pypi' || inputs.publish == 'both')
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --dir dist
      - name: Keep only the wheel
        run: find dist -type f ! -name '*.whl' -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-npm:
    name: Publish to npm
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || inputs.publish == 'npm' || inputs.publish == 'both')
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --dir dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A leading ./ keeps npm from reading the path as a GitHub repository.
        run: npm publish ./dist/ilyrics-*.tgz --provenance --access public
